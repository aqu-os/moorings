[package]
name = "moorings"
description = "Generational handle tables for no_std: values that never move, unique keys that can't outlive what they name, and only fallible allocation."
version.workspace = true
edition.workspace = true
authors.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
repository = "https://github.com/aqu-os/aquos"
readme = "README.md"
keywords = ["generational", "slotmap", "handle", "no-std", "arena"]
categories = ["data-structures", "no-std", "memory-management"]

[lints]
workspace = true

[features]
default = ["alloc"]
## `GlobalChunks`: tables allocate from the global allocator, fallibly. Works
## on stable.
alloc = []
## `InAllocator`: tables allocate from any `core::alloc::Allocator`. Needs
## nightly (`allocator_api`).
nightly = []

[dependencies]
# The feature list in the crate docs.
document-features.workspace = true

[[test]]
name = "moorings"
required-features = ["alloc"]
