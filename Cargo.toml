[package]
name = "moorings"
description = "Generational handle tables for no_std: values that never move, unique keys that can't outlive what they name, and only fallible allocation."
version = "0.1.1"
edition = "2024"
authors = ["Marcel Lambert <marcel_lambert@ymail.com>"]
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/aqu-os/aquos"
readme = "README.md"
keywords = ["generational", "slotmap", "handle", "no-std", "arena"]
categories = ["data-structures", "no-std", "memory-management"]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"


[lints.rustdoc]
broken_intra_doc_links = "warn"

[lints.clippy]
missing_docs_in_private_items = "warn"
# Kernel stacks are small and fixed-size; a frame or array that doesn't fit overflows them
# silently.
large_stack_frames = "forbid"
large_stack_arrays = "forbid"

[features]
default = ["alloc"]
## `GlobalChunks`: tables allocate from the global allocator, fallibly. Works
## on stable.
alloc = []
## `InAllocator`: tables allocate from any `core::alloc::Allocator`.
## Requires Rust 1.100+ (stabilised `allocator_api`).
allocator-api = []

[dependencies]
# The feature list in the crate docs.
document-features = "0.2.12"

[[test]]
name = "moorings"
required-features = ["alloc"]
