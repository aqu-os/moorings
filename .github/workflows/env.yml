name: Env

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain (from rust-toolchain.toml)
        run: rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-msrv
      - name: Verify the rust-version in Cargo.toml
        run: cargo msrv verify
      - name: Find the actual MSRV
        if: ${{ failure() }}
        run: cargo msrv find

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      # Dependencies, their licenses and sources only change with these files.
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            deps:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'deny.toml'
              - '.github/workflows/env.yml'
      - name: Check licenses, advisories, bans and sources (see deny.toml)
        if: steps.changes.outputs.deps == 'true'
        uses: EmbarkStudios/cargo-deny-action@v2
