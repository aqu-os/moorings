name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The compile-fail snapshots (tests/ui/*.stderr) depend on the exact
      # rustc version pinned there.
      - name: Install toolchain (from rust-toolchain.toml)
        run: rustup toolchain install
      - name: Build (no_std, without alloc)
        run: cargo build --workspace --verbose
      - name: Build (no_std, with alloc)
        run: cargo build --workspace --features alloc --verbose
      - name: Run unit, doc and compile-fail tests (all features)
        run: cargo test --workspace --all-features --verbose
